<div class="sgrpg chat-card attack-roll" data-actor-id="{{actor._id}}" data-item-id="{{item._id}}">
    <div class="dice-roll">
        <div class="dice-result">
            <h4 class="dice-formula">{{rollFormula}}</h4>
            <div class="dice-tooltip">
                <div class="dice-total">{{rollTotal}}</div>
            </div>
        </div>
    </div>

    <div class="card-buttons">
        <button data-action="damage">Roll Damage</button>
    </div>
</div>
